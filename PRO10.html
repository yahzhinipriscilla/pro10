<div class="ef-box">
  <h2>Charging Simulator</h2>
  <input type="text" id="vehicleName" placeholder="Vehicle name">
  <button class="ef-btn" id="setNameBtn" onclick="setName()">Set name</button>
  <p id="vehicleLabel">No vehicle selected.</p>
  <h1 id="percent" style="font-size:2.2rem">0%</h1>
  <button class="ef-btn" onclick="startCharge()">Start charging</button>
  <button class="ef-btn" onclick="stopCharge()">Stop</button>
  <hr>
  <button class="ef-btn" onclick="startReminder()">Remind me in 3 seconds</button>
  <button class="ef-btn" onclick="cancelReminder()">Cancel reminder</button>
  <p id="reminder"></p>
</div>

<footer>
  <p>Copyright 2026 by ecofleet Data. All Rights Reserved.</p>
</footer>

<script>
var chargeTimer = null, reminderTimer = null, level = 0;
function setName() {
  var name = document.querySelector("#vehicleName").value;
  document.querySelector("#vehicleLabel").textContent = name ? "Vehicle: " + name : "Please type a name.";
}
function startCharge() {
  if (chargeTimer) return;
  chargeTimer = setInterval(function () {
    level += 5;
    document.querySelector("#percent").textContent = level + "%";
    if (level >= 100) stopCharge();
  }, 500);
}
function stopCharge() { clearInterval(chargeTimer); chargeTimer = null; }
function startReminder() {
  var msg = document.querySelector("#reminder");
  msg.textContent = "Waiting...";
  reminderTimer = setTimeout(function () { msg.textContent = "Time to check the charger!"; }, 3000);
}
function cancelReminder() {
  clearTimeout(reminderTimer);
  document.querySelector("#reminder").textContent = "Reminder cancelled.";
}
</script>
